# Managed by the monorepo — edit distribution/mirrors/ there, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Nothing published may point at a file the tarball does not contain.
      - name: Check the tarball
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .
